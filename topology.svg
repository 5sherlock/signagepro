  <line x1="815" y1="1187" x2="863" y2="1187" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="839" y="1178" class="lbl" text-anchor="middle">pull</text>

  <rect x="70" y="1275" width="1010" height="175" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="90" y="1305" class="box-t" fill="#991b1b">핵심 원칙 / 주의</text>
  <text x="90" y="1333" class="box-s" fill="#7f1d1d">• 운영(현장 NAS)은 절대 자동 배포 금지 — 사람이 Tailscale로 접속해 직접 pull·빌드·재시작</text>
  <text x="90" y="1359" class="box-s" fill="#7f1d1d">• 원격 운영은 항상 main 을 pull (staging 아님) · 승격은 브랜치 머지로</text>
  <text x="90" y="1385" class="box-s" fill="#7f1d1d">• dev/staging은 폴더 분리 필수 (한 워킹트리는 한 브랜치만 → 동시 구동 불가)</text>
  <text x="90" y="1411" class="box-s" fill="#7f1d1d">• APK versionCode/versionName 은 +1 증가 · 기기 자율 배포 금지(사용자 수동)</text>
  <text x="90" y="1437" class="box-s" fill="#7f1d1d">• 멀티사이트 확장 시 현장별 최소형 NAS(로컬 캐시) 배치</text>

  <text x="70" y="1490" class="sub">포트 요약: 3000 대시보드Vite(dev) · 3001 dev API · 3300 staging/NAS운영 API · 5174 모바일Vite · 10081 dev HB · 10082 staging HB</text>
  <text x="70" y="1512" class="sub">상태: Tailscale 단일망은 목표(target). 현재 현장 STB(Android 5.1.1)는 ZeroTier 과도기 — 4K STB(큐버) 전환 후 Tailscale 일원화.</text>

