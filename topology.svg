  <!-- backup rules -->
  <rect x="80" y="845" width="1160" height="175" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="100" y="875" class="box-t" fill="#92400e">백업 원칙 / 주의</text>
  <text x="100" y="903" class="box-s" fill="#7c2d12">• 같은 드라이브에만 백업 금지 — C: 데이터 + C: 백업은 무의미. 반드시 별도 매체 + 오프사이트.</text>
  <text x="100" y="929" class="box-s" fill="#7c2d12">• 시크릿(.env)·keystore 외부 보관 시 평문 금지 → restic/Duplicati 등 암호화. keystore는 다중·오프사이트·암호화.</text>
  <text x="100" y="955" class="box-s" fill="#7c2d12">• SQLite는 .backup 또는 WAL 체크포인트로 — 라이브 파일 단순 복사는 손상 위험.</text>
  <text x="100" y="981" class="box-s" fill="#7c2d12">• 복구 테스트 분기 1회 — 복원 안 해본 백업은 백업이 아님.</text>
  <text x="100" y="1007" class="box-s" fill="#7c2d12">• 보존: 일일 14벌 + 주간 8벌 회전 · 코드는 git(GitHub)에 있어 백업 제외.</text>

