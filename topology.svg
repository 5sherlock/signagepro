  <text x="52" y="615" class="sec">② 백업 체계 — 3-2-1 (데이터 3벌 · 매체 2종 · 오프사이트 1벌)</text>
  <text x="52" y="638" class="sub">백업 대상(git에 없음, 필수): DB(dev.db) · .env(시크릿) · keystore(대체불가) · uploads(미디어)</text>

