  <text x="972" y="1224" class="lbl" text-anchor="middle">tailnet 내부 공개 (외부 X)</text>

  <line x1="285" y1="1187" x2="333" y2="1187" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
